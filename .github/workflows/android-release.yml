name: Android Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project (doctor, type-check, lint in parallel)
        run: |
          set -euo pipefail
          fail=0
          npx expo-doctor & p1=$!
          npx tsc --noEmit & p2=$!
          npm run lint & p3=$!
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

  build:
    name: Build release APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Authenticate with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build release APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile release-apk \
            --non-interactive \
            --wait \
            --json > build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "apk-url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "Built APK (build ID: $BUILD_ID)"

      - name: Download APK
        run: |
          set -euo pipefail
          curl -fL "${{ steps.build.outputs.apk-url }}" -o kharcha.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-release-apk
          path: kharcha.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" kharcha.apk \
            --repo "${{ github.repository }}" \
            --title "Kharcha ${{ github.ref_name }}" \
            --generate-notes
