name: Android Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project (doctor, type-check, lint in parallel)
        run: |
          set -euo pipefail
          fail=0
          npx expo-doctor & p1=$!
          npx tsc --noEmit & p2=$!
          npm run lint & p3=$!
          wait "$p1" || fail=1
          wait "$p2" || fail=1
          wait "$p3" || fail=1
          exit "$fail"

  build:
    name: Build release APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from git tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            echo "Synced app version to $VERSION"
          else
            echo "No tag; keeping existing version"
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Authenticate with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build release APK
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build \
            --platform android \
            --profile release-apk \
            --non-interactive \
            --wait \
            --json > build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "apk-url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "Built APK (build ID: $BUILD_ID)"

      - name: Download and extract APKs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p apks
          curl -fL "${{ steps.build.outputs.apk-url }}" -o apks/archive

          if file apks/archive | grep -q 'gzip compressed'; then
            tar -xzf apks/archive -C apks
          else
            cp apks/archive apks/app.apk
          fi

          find apks -type f \( -name '*.apk' -o -name '*.aab' \) | sort

          ARM64=$(find apks -type f -name '*arm64*.apk' | head -n1 || true)
          UNIVERSAL=$(find apks -type f -name '*universal*.apk' | head -n1 || true)
          FALLBACK=$(find apks -type f -name '*.apk' ! -name '*arm64*' ! -name '*universal*' | head -n1 || true)

          if [ -n "$ARM64" ]; then
            mv "$ARM64" "Kharcha-v${VERSION}-arm64-v8a.apk"
            echo "Prepared arm64 APK"
          fi
          if [ -n "$UNIVERSAL" ]; then
            mv "$UNIVERSAL" "Kharcha-v${VERSION}-universal.apk"
            echo "Prepared universal APK"
          elif [ -n "$FALLBACK" ]; then
            mv "$FALLBACK" "Kharcha-v${VERSION}-universal.apk"
            echo "Prepared universal APK (fallback)"
          fi

          ls -lh Kharcha-v${VERSION}-*.apk
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-release-apks
          path: Kharcha-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --no-merges --pretty=format:'%s' "$PREV_TAG"..HEAD | sed 's/^/- /')
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          else
            CHANGES="- Release $VERSION"
            COMPARE_URL=""
          fi

          printf '%s\n' \
            "## What's Changed" \
            "$CHANGES" \
            "" \
            "**Full Changelog**: $COMPARE_URL" > /tmp/release-body.md

          gh release create "${{ github.ref_name }}" Kharcha-v*.apk \
            --repo "${{ github.repository }}" \
            --title "Kharcha ${{ github.ref_name }}" \
            --notes-file /tmp/release-body.md
